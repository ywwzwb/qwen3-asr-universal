# .github/workflows/release.yml
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, arch: x64, backend: cpu}
          - {os: windows-latest, arch: x64, backend: cuda}
          - {os: windows-latest, arch: x64, backend: vulkan}
          - {os: ubuntu-latest,  arch: x64, backend: cpu}
          - {os: ubuntu-latest,  arch: x64, backend: cuda}
          - {os: ubuntu-latest,  arch: x64, backend: vulkan}
          - {os: macos-14,       arch: arm64, backend: metal}
          - {os: macos-14,       arch: arm64, backend: cpu}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # NOTE: no `pip install -e .` — that would source-build a CPU llama-cpp-python
      # on Windows and poison every GPU target; ci/build.py installs all deps.
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # Ubuntu 20.04 runner is retired; build in a manylinux_2_28 container
            # (glibc >= 2.28) on the host runner for wide binary compatibility.
            docker run --rm \
              -v "$PWD:/src" -w /src \
              -e TARGET=linux-${{ matrix.arch }}-${{ matrix.backend }} \
              quay.io/pypa/manylinux_2_28_x86_64 bash ci/build_linux_container.sh
          else
            python ci/build.py ${{ matrix.os == 'windows-latest' && 'windows' || 'macos' }}-${{ matrix.arch }}-${{ matrix.backend }}
          fi
      - name: Smoke test binary
        shell: bash
        run: |
          BIN=dist/q3asr
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN=dist/q3asr.exe; fi
          OUT="$("$BIN" --version)"
          echo "$OUT"
          test "$OUT" = "q3asr 0.1.0"
      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.os }}-${{ matrix.backend }}
          path: qwen3-asr-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
          path: zips
      - name: Build root manifest
        shell: python
        run: |
          import hashlib, json, pathlib
          assets = []
          for p in sorted(pathlib.Path("zips").glob("qwen3-asr-*.zip")):
              parts = p.name.replace("qwen3-asr-", "").replace(".zip", "").split("-")
              os_n, arch, backend = parts[0], parts[1], "-".join(parts[2:])
              assets.append({"os": os_n, "arch": arch, "backend": backend,
                             "filename": p.name,
                             "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                             "size": p.stat().st_size,
                             "cli": "q3asr.exe" if os_n == "windows" else "q3asr"})
          root = {"version": "${{ github.ref_name }}", "assets": assets}
          pathlib.Path("zips/manifest.json").write_text(json.dumps(root, indent=2))
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: zips/*
